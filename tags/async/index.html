  (() => {
    if (customElements.get('raven-background')) return;
    // Native page loads must reuse the same arrangement as client navigation.
    let seed = 1;
    try {
      const saved = Number(sessionStorage.getItem('feather-seed'));
      seed = Number.isInteger(saved) && saved > 0 && saved < 2147483647
        ? saved : Math.floor(Math.random() * 2147483646) + 1;
      sessionStorage.setItem('feather-seed', String(seed));
    } catch {
      // A fixed seed keeps the background stable when storage is unavailable.
      seed = 1;
    }
    const random = () => {
      seed = seed * 16807 % 2147483647;
      return (seed - 1) / 2147483646;
    };
    const arrangements = [0, 1].map((index) => ({
      top: `${(index ? 60 : 15) + random() * (index ? 17 : 25)}%`,
      angle: `${(index ? 35 : -28) + random() * 45 + (random() < .35 ? 180 : 0)}deg`,
      scale: String((index ? .35 : .8) + random() * .18),
      inset: `${-.5 + random()}rem`,
      shape: ['full', 'slender', 'swept'][Math.floor(random() * 3)],
    }));
    customElements.define('raven-background', class extends HTMLElement {
      connectedCallback() {
        this.querySelectorAll('.feather').forEach((feather, index) => {
          const arrangement = arrangements[index];
          if (!arrangement) return;
          for (const key of ['top', 'angle', 'scale', 'inset']) {
            feather.style.setProperty(`--${key}`, arrangement[key]);
          }
          feather.dataset.shape = arrangement.shape;
        });
      }
    });
  })();
